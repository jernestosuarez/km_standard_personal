      <stop offset="0" stop-color="#081420"/>
      <stop offset="0.72" stop-color="#0E2334"/>
      <stop offset="1" stop-color="#0A1826"/>
    </linearGradient>
    <radialGradient id="tealwash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1E5D66" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1E5D66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberwash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8A6420" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8A6420" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeglow" cx="0.5" cy="0.5" r="0.5">
