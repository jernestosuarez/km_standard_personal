    <circle cx="932" cy="206" r="12.0" fill="#4FD1C5" opacity="0.10"/><circle cx="932" cy="206" r="6.6" fill="#4FD1C5" opacity="0.22"/><circle cx="932" cy="206" r="3.4" fill="#4FD1C5"/>
    <circle cx="972" cy="176" r="12.0" fill="#4FD1C5" opacity="0.10"/><circle cx="972" cy="176" r="6.6" fill="#4FD1C5" opacity="0.22"/><circle cx="972" cy="176" r="3.4" fill="#4FD1C5"/>
