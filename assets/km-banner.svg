  <text x="78" y="186" font-size="88" font-weight="bold" fill="#F5F9FC">KM <tspan fill="#4FD1C5">Standard</tspan></text>
  <text x="82" y="232" font-size="24" fill="#AFC4D8">Governed knowledge hubs in plain Markdown and Git.</text>
