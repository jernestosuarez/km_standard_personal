# The release gate. One command, one verdict.
#
# This job runs tools/km-release-gate.py, which discovers every tracked check in any tests/ or
# scripts/ directory, at the root or nested, runs them, and adds a shell syntax check, a JSON and JSON-LD parse
# check, a Python syntax check and a relative-link check over the tracked tree. Its exit status is
# this job's status: 0 pass, 1 fail, 2 refused. A refusal is not a pass.
#
# EXPECTED DURATION: measured at 8 to 11 minutes on the maintainer's machine across four full runs,
# and the gate prints its own total and its three slowest checks on every run so this comment can be
# checked rather than believed. Two suites dominate it: tests/test_hub_scan_canaries.sh at roughly 5
# minutes and tests/test_hub_deployment_binding.sh at roughly 2, with everything else together under
# 3. A hosted runner is normally slower than a developer machine, so budget more here than the local
# figure. timeout-minutes is set well above either, so a slow runner is not read as a failing tree,
# and a run that hits the timeout is a signal in itself.
#
# WHAT A GREEN RUN HERE DOES NOT MEAN. Both limits are stated in STANDARD.md and in the runner's own
# header, and they are repeated here because a badge is read where the standard is not.
#
#   1. THIS JOB DOES NOT RUN AN ORGANISATION LEAKAGE SCAN, AND CANNOT. That scan needs a denylist
#      generated from a real organisation's own entity names, and that denylist lives outside this
#      repository BY DESIGN: carrying it here would itself be the leakage the guard exists to
#      prevent. The gate runs the leakage instrument's canaries and so proves the INSTRUMENT works.
#      It can never prove that a given push is clean. The fail-closed pre-push hook on a
#      deployment's own clone is the only thing that scans an actual push, and it is local and
#      untracked. This is a stated limit, not a defect awaiting a fix.
#
#   2. THIS JOB DOES NOT SUPPLY A SECOND ACTOR. The minimum viable independence is an adversarial
#      pass, by someone other than the change's author, against the specific class being repaired.
#      No runner verifies that it happened. What the gate requires instead is the declaration: every
#      check carries a machine-read `km-unrepaired-tree:` line recording what it found when it was
#      run against the tree it was written to catch, and a missing, empty or unre-stated declaration
#      fails the gate. A green run means the mechanical checks ran. It does not mean anyone other
#      than the author looked.

name: release-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    # Pinned rather than ubuntu-latest: the gate's verdict should change when this repository
    # changes, not when the hosted image does.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # actions/checkout v4.2.2, pinned by commit SHA. fetch-depth 0 because the gate resolves a
      # base revision to check that a check added or changed by this push declares its run against
      # the unrepaired tree; with a shallow clone that resolves to nothing and the gate reports a
      # coverage gap instead of checking it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve the base revision this push is measured against
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "KM_GATE_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          else
            echo "KM_GATE_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi

      - name: Run the release gate
        run: python3 tools/km-release-gate.py
