# The release gate. One command, one verdict.
#
# This job runs tools/km-release-gate.py, which discovers every tracked check in any tests/ or
# scripts/ directory, at the root or nested, runs them, and adds a shell syntax check, a JSON and JSON-LD parse
# check, a Python syntax check and a relative-link check over the tracked tree. Its exit status is
# this job's status: 0 pass, 1 fail, 2 refused. A refusal is not a pass.
#
# EXPECTED DURATION: measured at 8 to 11 minutes on the maintainer's machine across four full runs,
# and the gate prints its own total and its three slowest checks on every run so this comment can be
# checked rather than believed. Two suites dominate it: tests/test_hub_scan_canaries.sh at roughly 5
# minutes and tests/test_hub_deployment_binding.sh at roughly 2, with everything else together under
# 3. A hosted runner is normally slower than a developer machine, so budget more here than the local
# figure. timeout-minutes is set well above either, so a slow runner is not read as a failing tree,
# and a run that hits the timeout is a signal in itself.
#
# WHAT A GREEN RUN HERE DOES NOT MEAN. This file used to carry its own copy of the gate's limits.
# The copy described TWO of them; the gate printed FOUR, and had done since the fourth was added.
# An external reviewer found the drift on 2026-08-25. A copy of a list that lives somewhere else
# will drift again, so there is no copy here any more: the first step of this job runs
# `python3 tools/km-release-gate.py --limits`, which prints the gate's limits into the log from the
# single definition the gate itself prints from. Adding a limit is an edit to that definition and to
# nothing else. tests/test_release_gate.sh case 20 asserts that the flag prints every limit defined
# and that this workflow invokes it, so the pointer cannot rot back into a copy.
#
# The short of it, for a reader who will not open the log: a green run means the mechanical checks
# ran. It does not mean the push is free of organisation leakage, and it does not mean anyone other
# than the author looked.

name: release-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    # NOT A PIN, and the word matters. GitHub redeploys its version-labelled runner images on a
    # weekly cadence, so the image behind `ubuntu-24.04` changes underneath this label and the
    # environment is mutable. What the label does buy is smaller and true: the job does not move to
    # a new Ubuntu major release without an edit here, which `ubuntu-latest` would do on its own.
    # A genuine pin is what the checkout step below has, a commit SHA.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # actions/checkout v4.2.2, pinned by commit SHA. fetch-depth 0 because the gate resolves a
      # base revision to check that a check added or changed by this push declares its run against
      # the unrepaired tree; with a shallow clone that resolves to nothing and the gate reports a
      # coverage gap instead of checking it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve the base revision this push is measured against
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "KM_GATE_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          else
            echo "KM_GATE_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi

      - name: State what a green run here does not mean
        run: python3 tools/km-release-gate.py --limits

      - name: Run the release gate
        run: python3 tools/km-release-gate.py
